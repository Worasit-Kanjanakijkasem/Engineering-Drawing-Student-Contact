<!DOCTYPE html>
<html lang="th">
<head>
  
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

  .page-container {
    width: 100%;
    max-width: 480px;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
  }

  .g_id_signin {
    display: flex;
    justify-content: center;
    transform: scale(1.5);
    transform-origin: center;
    margin: 18px 0;
  }
  </style>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Engineering Drawing - Student Contact</title>

  <script src="https://accounts.google.com/gsi/client"
          async defer></script>
</head>

<body>
  <div class="page-container">
  <h2>Engineering Drawing - Student Contact</h2>

  <p>Please sign in with your @go.buu.ac.th account.</p>

  <div id="g_id_onload"
       data-client_id="444828852273-52ssitv2kd1t05eshr489d3apq93ugpi.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-auto_prompt="false">
  </div>

  <div class="g_id_signin"
       data-type="standard">
  </div>

  <p id="status">Please sign in.</p>

<form id="contactForm" hidden>
  <p>
    <label for="courseCode">Course</label>
    <select id="courseCode" required>
      <option value="">Select course</option>
      <option value="50310164">50310164</option>
      <option value="50310169">50310169</option>
    </select>
  </p>

  <p>
    <label for="section">Section</label>
    <select id="section" required>
      <option value="">Select section</option>
    </select>
  </p>

  <p>
    <label for="subject">Subject</label>
    <input id="subject" type="text" maxlength="200" required>
  </p>

  <p>
    <label for="message">Message</label>
    <textarea id="message" maxlength="5000" required></textarea>
  </p>

  <button type="submit" disabled>Send message</button>
</form>

  <script>
    function handleCredentialResponse(response) {
      window.studentIdToken = response.credential;

      document.getElementById("status").textContent =
        "Google Sign-In completed. Please complete the form.";

      document.getElementById("contactForm").hidden = false;
    }
    const COURSE_SECTIONS = {
      "50310164": ["1", "2", "3"],
      "50310169": ["1", "2"]
    };

  document.getElementById("courseCode").addEventListener("change", function () {
    const courseCode = this.value;
    const sectionSelect = document.getElementById("section");

    sectionSelect.innerHTML = '<option value="">Select section</option>';

    const sections = COURSE_SECTIONS[courseCode] || [];

    sections.forEach(function (section) {
      const option = document.createElement("option");
      option.value = section;
      option.textContent = section;
      sectionSelect.appendChild(option);
    });
  });
  </script>
  </div>
</body>
</html>
