<!DOCTYPE html>
<html lang="th">
<head>
  
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

  .page-container {
    width: 100%;
    max-width: 480px;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
  }

  .g_id_signin {
    display: flex;
    justify-content: center;
  }
</style>

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Engineering Drawing - Student Contact</title>

  <script src="https://accounts.google.com/gsi/client"
          async defer></script>
</head>

<body>
  <h2>Engineering Drawing - Student Contact</h2>

  <p>Please sign in with your @go.buu.ac.th account.</p>

  <div id="g_id_onload"
       data-client_id="444828852273-52ssitv2kd1t05eshr489d3apq93ugpi.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-auto_prompt="false">
  </div>

  <div class="g_id_signin"
       data-type="standard">
  </div>

  <p id="status">Please sign in.</p>

  <script>
    function handleCredentialResponse(response) {
      document.getElementById("status").textContent =
        "Google Sign-In response received. " +
        "Server verification is not yet implemented.";
    }
  </script>
</body>
</html>
