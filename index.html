  <title>Engineering Drawing - Student Contact</title>

  <script src="https://accounts.google.com/gsi/client"
          async defer></script>
</head>

<body>
  <h2>Engineering Drawing - Student Contact</h2>

  <p>Please sign in with your @go.buu.ac.th account.</p>

  <div id="g_id_onload"
       data-client_id="444828852273-52ssitv2kd1t05eshr489d3apq93ugpi.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-auto_prompt="false">

    function handleCredentialResponse(response) {

        "Server verification is not yet implemented.";

</body>
